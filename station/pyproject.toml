[project]
name = "forest-station"
version = "0.1.0"
description = "Offline, CPU-only forest smoke observation station"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "onnxruntime>=1.20,<2", "fastapi>=0.115,<1", "uvicorn>=0.32,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
forest-station = "station.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["station"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real model and downloaded real video, entirely offline"]
